[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beampptx"
version = "0.1.0"
description = "Convert LaTeX Beamer slides to PowerPoint with vector graphics and video support."
authors = [
  { name="Viktor Kocur", email="kocurvik@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "python-pptx",
    "pymupdf",
    "lxml",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/kocurvik/beampptx"
Issues = "https://github.com/kocurvik/beampptx/issues"

[project.scripts]
beampptx = "generate_pptx:main"

[tool.setuptools]
py-modules = ["generate_pptx"]
